# git-cliff configuration (Task 38, fulla-sdk-refactor).
#
# Used by .github/workflows/release.yml to generate the GitHub Release notes
# for the pushed tag (`git cliff --latest --strip header`). Maintainers can
# also refresh CHANGELOG.md locally before tagging:
#
#   git cliff --unreleased --tag vX.Y.Z --prepend CHANGELOG.md
#
# (CHANGELOG.md stays curated/hand-edited; the release workflow deliberately
# does NOT push commits back from a tag ref.)

[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
# Keep a Changelog-flavoured sections, grouped by conventional commit type.
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
# Non-conventional commits (rare in this history) are kept, lumped under
# "Other", instead of silently dropped.
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
# Release tags only (strict SemVer, mirrors release.yml's trigger pattern);
# utility tags like pre-b10 / backup/* never delimit a release section.
tag_pattern = "v[0-9]+.[0-9]+.[0-9]+"
sort_commits = "oldest"

commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^docs\\(spec\\)", skip = true },
  { message = "^chore\\(spec\\)", skip = true },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Testing" },
  { message = "^(build|ci)", group = "<!-- 6 -->CI/Build" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "<!-- 7 -->Miscellaneous" },
  { message = ".*", group = "<!-- 8 -->Other" },
]
