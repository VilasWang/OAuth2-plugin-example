  /api/password-reset/confirm:
    post:
      description: Confirm a password reset using the token sent via email.
      operationId: post_api_password-reset_confirm
      responses:
        '200':
          description: Password reset successful
        '400':
          description: Invalid or expired token
      summary: Confirm Password Reset
      tags:
      - User Verification
  /api/password-reset/request:
    post:
      description: Request a password reset link to be sent via email.
      operationId: post_api_password-reset_request
      responses:
        '200':
          description: Reset link sent if the email exists
        '400':
          description: Invalid request
      summary: Request Password Reset
      tags:
      - User Verification
  /api/register:
    post:
      description: Registers a new user account into the system.
      operationId: post_api_register
      parameters:
      - description: Desired username (required)
        in: query
        name: username
        required: true
        schema:
          type: string
      - description: Strong password (required)
        in: query
        name: password
        required: true
        schema:
          type: string
      - description: Email address (optional)
        in: query
        name: email
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                message: User registered successfully
                status: success
          description: User registered successfully
        '400':
          description: Invalid registration data
      summary: Register new user
      tags:
      - User
      - Registration
  /api/verify-email:
    get:
      description: Verify an email address using a token.
      operationId: get_api_verify-email
      responses:
        '200':
          description: Email verified successfully
        '400':
          description: Invalid or expired token
      summary: Verify Email
      tags:
      - User Verification
  /api/verify-email/resend:
    post:
      description: Resend the email verification link.
      operationId: post_api_verify-email_resend
      responses:
        '200':
          description: Verification email sent
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '404':
          description: User not found
      summary: Resend Verification Email
      tags:
      - User Verification
  /api/wechat/login:
    post:
      description: Exchange WeChat authorization code for user information. This endpoint
        handles the server-side OAuth2 flow with WeChat Open Platform.
      operationId: post_api_wechat_login
      parameters:
      - description: Authorization code from WeChat OAuth2 callback (required)
        in: query
        name: code
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                headimgurl: https://thirdwx.qlogo.cn/...
                nickname: WeChat User
                openid: oXXXXXXXXXXXXXXXXXXXXXXXXXX
          description: WeChat user info retrieved successfully
        '400':
          content:
            application/json:
              example:
                error: Missing code parameter
          description: Invalid request (missing or invalid code)
        '502':
          description: Failed to contact WeChat API
      summary: WeChat OAuth2 Login
      tags:
      - External Auth
      - WeChat
  /health:
    get:
      description: Returns the health status of the service.
      operationId: get_health
      responses:
        '200':
          content:
            application/json:
              example:
                status: ok
                version: 1.0.0
          description: Service is healthy
      summary: Health check
      tags:
      - System
  /oauth2/authorize:
    get:
      description: OAuth2 authorization endpoint - initiates authorization flow
      operationId: get_oauth2_authorize
      parameters:
      - description: Client identifier (required)
        in: query
        name: client_id
        required: true
        schema:
          type: string
      - description: Redirect URI (required)
        in: query
        name: redirect_uri
        required: true
        schema:
          type: string
      - description: Response type, must be 'code' (required)
        in: query
        name: response_type
        required: true
        schema:
          type: string
      - description: Requested scope (optional)
        in: query
        name: scope
        required: false
        schema:
          type: string
      - description: Opaque value to maintain state between request and callback (recommended)
        in: query
        name: state
        required: false
        schema:
          type: string
      - description: PKCE code challenge (RFC 7636). Required for public clients
          when auth.require_pkce_for_public is enabled (default true).
        in: query
        name: code_challenge
        required: false
        schema:
          type: string
      - description: PKCE code challenge method ('plain' or 'S256')
        in: query
        name: code_challenge_method
        required: false
        schema:
          type: string
      - description: OIDC nonce (anti-replay). Echoed in the id_token when openid
          scope is requested.
        in: query
        name: nonce
        required: false
        schema:
          type: string
      - description: 'OIDC prompt values, space-separated (none|login|consent).
          none forbids UI; login forces re-auth; consent forces the consent
          screen. Combining none with another value returns 400. (OIDC Core
          §3.1.2.1)'
        in: query
        name: prompt
        required: false
        schema:
          type: string
      - description: Maximum allowable age in seconds of the user's authentication.
          If the session auth_time is older, re-authentication is forced.
        in: query
        name: max_age
        required: false
        schema:
          type: integer
      responses:
        '302':
          description: Redirect to client with authorization code (or an error=
            redirect for prompt=none / invalid_scope / etc.)
        '400':
          description: Invalid request (malformed prompt, missing required params)
      summary: Request authorization
      tags:
      - OAuth2
      - Authorization
  /oauth2/consent:
    post:
      description: Submit user consent for requested scopes. Redirects back to client.
      operationId: post_oauth2_consent
      parameters:
      - description: Client identifier (required)
        in: query
        name: client_id
        required: true
        schema:
          type: string
      - description: User identifier (required)
        in: query
        name: user_id
        required: true
        schema:
          type: string
      - description: Requested scope to consent (required)
        in: query
        name: scope
        required: true
        schema:
          type: string
      - description: Redirect URI (required)
        in: query
        name: redirect_uri
        required: true
        schema:
          type: string
      - description: Opaque value to maintain state
        in: query
        name: state
        required: false
        schema:
          type: string
      - description: 'Action to perform: ''approve'' or ''deny'' (required)'
        in: query
        name: action
        required: true
        schema:
          enum:
          - approve
          - deny
          type: string
      responses:
        '302':
          description: Redirect to client with authorization code or error
      summary: Submit user consent
      tags:
      - OAuth2
      - Consent
  /oauth2/device/verify:
    get:
      description: Display device verification page.
      operationId: get_oauth2_device_verify
      responses:
        '200':
          description: Device verification page
      summary: Verify Device (GET)
      tags:
      - OAuth2
      - Device Flow
    post:
      description: Submit device verification code.
      operationId: post_oauth2_device_verify
      responses:
        '200':
          description: Device verification submitted
      summary: Verify Device (POST)
      tags:
      - OAuth2
      - Device Flow
  /oauth2/device_authorization:
    post:
      description: Request device authorization.
      operationId: post_oauth2_device_authorization
      responses:
        '200':
          description: Device authorization response
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: Device Authorization
      tags:
      - OAuth2
      - Device Flow
  /oauth2/introspect:
    post:
      description: RFC 7662 OAuth 2.0 Token Introspection. Returns information about
        a token.
      operationId: post_oauth2_introspect
      parameters:
      - description: The string value of the token (required)
        in: query
        name: token
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                active: true
                client_id: client_123
                exp: 1680000000
                scope: read write
                sub: user_456
                token_type: Bearer
          description: Token status and metadata
        '400':
          description: Invalid request
        '401':
          description: Authentication failed
        '429':
          description: 'Too Many Requests -- F-018 rate limit tripped by repeated
            failed authentication/validation attempts for this (client_ip, client_id).
            Accompanied by a Retry-After header and an OAuth2-style {error:
            invalid_request, error_description} body.'
      security:
      - clientCredentialsAuth: []
      summary: Introspect token
      tags:
      - OAuth2
      - Token
  /oauth2/login:
    post:
      description: Authenticates user credentials and generates an authorization code.
        Usually called by the frontend login page during the authorization code flow.
      operationId: post_oauth2_login
      parameters:
      - description: User's account username (required)
        in: query
        name: username
        required: true
        schema:
          type: string
      - description: User's password (required)
        in: query
        name: password
        required: true
        schema:
          type: string
      - description: Client identifier matches the requesting app (required)
        in: query
        name: client_id
        required: true
        schema:
          type: string
      - description: Redirect URI matching the registered client (required)
        in: query
        name: redirect_uri
        required: true
        schema:
          type: string
      - description: Requested scope, space-separated (optional)
        in: query
        name: scope
        required: false
        schema:
          type: string
      - description: Opaque value to maintain state (recommended)
        in: query
        name: state
        required: false
        schema:
          type: string
      - description: PKCE code challenge (RFC 7636). REQUIRED for PUBLIC clients
          (vue-client, admin-console) when auth.require_pkce_for_public is
          enabled (default true, F-011 / RFC 9700 §2.1.1). The matching
          code_verifier must be sent on the /oauth2/token exchange.
        in: query
        name: code_challenge
        required: false
        schema:
          type: string
      - description: 'PKCE code challenge method: S256 (recommended) or plain.'
        in: query
        name: code_challenge_method
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                redirect_uri: http://127.0.0.1:5173/callback?code=xyz123
                status: success
          description: Authentication successful (JSON with redirect_uri)
        '302':
          description: Redirect with authorization code (if requested via browser)
        '401':
          content:
            application/json:
              example:
                error: invalid_client
          description: Authentication failed
      summary: Authenticate user
      tags:
      - OAuth2
      - Authentication
  /oauth2/mfa/disable:
    post:
      description: Disable MFA for the authenticated user.
      operationId: post_oauth2_mfa_disable
      responses:
        '200':
          description: MFA disabled successfully
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: Disable MFA
      tags:
      - MFA
  /oauth2/mfa/setup:
    post:
      description: Initiate MFA setup by generating a TOTP secret.
      operationId: post_oauth2_mfa_setup
      responses:
        '200':
          description: MFA setup initiated
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: Setup MFA
      tags:
      - MFA
  /oauth2/mfa/setup/verify:
    post:
      description: Verify a TOTP code to finalize MFA setup.
      operationId: post_oauth2_mfa_setup_verify
      responses:
        '200':
          description: MFA enabled successfully
        '400':
          description: Invalid request
        '401':
          description: Unauthorized or invalid code
      security:
      - bearerAuth: []
      summary: Verify MFA Setup
      tags:
      - MFA
  /oauth2/mfa/verify:
    post:
      description: Verify MFA (TOTP) code during login. Completes the
        authorization-code issuance started by /oauth2/login when MFA was
        required. The PKCE code_verifier (C4, RFC 7636) must be supplied so
        the internally-generated code passes PKCE verification against the
        code_challenge persisted on the session during the first-factor
        login step.
      operationId: post_oauth2_mfa_verify
      parameters:
      - description: The MFA pending token returned by /oauth2/login when
          mfa_required was true (required).
        in: query
        name: mfa_token
        required: true
        schema:
          type: string
      - description: The 6-digit TOTP code from the user's authenticator
          (required).
        in: query
        name: code
        required: true
        schema:
          type: string
      - description: The client_id from the original login (required, must
          match the first-factor login).
        in: query
        name: client_id
        required: true
        schema:
          type: string
      - description: The redirect_uri from the original login (required,
          must match).
        in: query
        name: redirect_uri
        required: true
        schema:
          type: string
      - description: PKCE code_verifier matching the code_challenge sent on
          the first-factor /oauth2/login step (C4, RFC 7636). Required for
          PUBLIC clients.
        in: query
        name: code_verifier
        required: false
        schema:
          type: string
      responses:
        '200':
          description: MFA verification successful — returns the token pair
            (access_token, refresh_token, id_token).
        '400':
          description: Invalid request (missing mfa_token/code, malformed TOTP)
        '401':
          description: Invalid MFA code or client/redirect mismatch
      summary: Verify MFA Code (Login)
      tags:
      - MFA
  /oauth2/register:
    post:
      description: Dynamic client registration.
      operationId: post_oauth2_register
      responses:
        '201':
          description: Client registered successfully
        '400':
          description: Invalid client metadata
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: Register Client
      tags:
      - OAuth2
      - Dynamic Registration
  /oauth2/end_session:
    get:
      description: 'OIDC RP-Initiated Logout 1.0 §2. Terminates the user''s server-side
        session and (optionally) redirects to a registered post_logout_redirect_uri.
        post_logout_redirect_uri MUST be registered for the client identified by
        id_token_hint (its aud claim); without a hint the request is rejected with
        400 when a redirect URI is supplied. Accepts both GET (link-based) and POST
        (form-based).'
      operationId: get_oauth2_end_session
      parameters:
      - description: Previously issued id_token hinting at the client/session to
          terminate. The aud claim identifies the client for validating
          post_logout_redirect_uri (signature not verified per §2.2).
        in: query
        name: id_token_hint
        required: false
        schema:
          type: string
      - description: URI to redirect to after logout. Must be registered for the
          id_token_hint client; rejected with 400 otherwise.
        in: query
        name: post_logout_redirect_uri
        required: false
        schema:
          type: string
      - description: Opaque value echoed back to the post_logout_redirect_uri.
        in: query
        name: state
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Logged out (no post_logout_redirect_uri supplied)
        '302':
          description: Redirect to the validated post_logout_redirect_uri (with state)
        '400':
          description: post_logout_redirect_uri not registered / no id_token_hint
      summary: RP-Initiated Logout
      tags:
      - OAuth2
      - OIDC
    post:
      description: OIDC RP-Initiated Logout (POST form-based variant; see GET for
        semantics).
      operationId: post_oauth2_end_session
      parameters:
      - description: Previously issued id_token hint.
        in: query
        name: id_token_hint
        required: false
        schema:
          type: string
      - description: Registered post-logout redirect URI.
        in: query
        name: post_logout_redirect_uri
        required: false
        schema:
          type: string
      - description: Opaque state value.
        in: query
        name: state
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Logged out
        '302':
          description: Redirect to post_logout_redirect_uri
        '400':
          description: Invalid post_logout_redirect_uri
      summary: RP-Initiated Logout (POST)
      tags:
      - OAuth2
      - OIDC
  /oauth2/revoke:
    post:
      description: "RFC 7009 OAuth 2.0 Token Revocation. Revokes an access OR
        refresh token (C3 fix — refresh tokens are now actually revoked, not
        silently no-op'd). The caller must be the token's owning client
        (ownership enforced via introspection). CONFIDENTIAL clients
        authenticate via client_secret (HTTP Basic or body); PUBLIC clients
        (token_endpoint_auth_method='none') authenticate with client_id only
        (RFC 7009 §2.1 exempts them from client authentication at this
        endpoint)."
      operationId: post_oauth2_revoke
      parameters:
      - description: The token that the client wants to get revoked (required)
        in: query
        name: token
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: Token revoked successfully or token did not exist
        '400':
          description: Invalid request
        '401':
          description: Authentication failed
        '429':
          description: 'Too Many Requests -- F-018 rate limit tripped by repeated
            failed authentication/validation attempts for this (client_ip, client_id).
            Accompanied by a Retry-After header and an OAuth2-style {error:
            invalid_request, error_description} body.'
      security:
      - clientCredentialsAuth: []
      summary: Revoke token
      tags:
      - OAuth2
      - Token
  /oauth2/token:
    post:
      description: OAuth2 token endpoint - exchanges authorization code or refresh
        token for access token.
      operationId: post_oauth2_token
      parameters:
      - description: Type of grant being requested
        in: query
        name: grant_type
        required: true
        schema:
          enum:
          - authorization_code
          - refresh_token
          - client_credentials
          - urn:ietf:params:oauth:grant-type:device_code
          type: string
      - description: Authorization code (required for grant_type=authorization_code)
        in: query
        name: code
        required: false
        schema:
          type: string
      - description: Refresh token (required for grant_type=refresh_token)
        in: query
        name: refresh_token
        required: false
        schema:
          type: string
      - description: Client identifier (required)
        in: query
        name: client_id
        required: true
        schema:
          type: string
      - description: Client secret (required for CONFIDENTIAL clients with
          token_endpoint_auth_method=client_secret_post; FORBIDDEN for PUBLIC
          clients whose method is 'none' — F-017 rejects a secret sent by a
          'none' client).
        in: query
        name: client_secret
        required: false
        schema:
          type: string
      - description: Redirect URI (required for authorization_code grant)
        in: query
        name: redirect_uri
        required: false
        schema:
          type: string
      - description: PKCE code_verifier (RFC 7636). Required for the
          authorization_code grant when the corresponding /oauth2/login (or
          /oauth2/authorize) request sent a code_challenge. The server
          verifies SHA-256(code_verifier) == the stored code_challenge.
        in: query
        name: code_verifier
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                expires_in: 3600
                refresh_token: ref_123456789
                scope: openid profile
                token_type: Bearer
          description: 'Token response with access_token and refresh_token. F-019
            (RFC 6749 §5.1): success responses carry Cache-Control: no-store and
            Pragma: no-cache and MUST NOT be cached.'
          headers:
            Cache-Control:
              description: Always "no-store" -- token responses MUST NOT be cached.
              schema:
                type: string
            Pragma:
              description: Always "no-cache" (HTTP/1.0 back-compat fallback).
              schema:
                type: string
        '400':
          content:
            application/json:
              example:
                error: invalid_grant
                error_description: Invalid authorization code
          description: Invalid request
        '401':
          description: Authentication failed
        '429':
          description: 'Too Many Requests -- F-018 rate limit tripped by repeated
            failed authentication/validation attempts for this (client_ip, client_id),
            including device_code polling. Accompanied by a Retry-After header and
            an OAuth2-style {error: invalid_request, error_description} body.'
      summary: Exchange authorization code for access token
      tags:
      - OAuth2
      - Token
  /oauth2/userinfo:
    get:
      description: 'Returns information about the authenticated user. F-023 (OIDC
        Core §5.3): the access token''s scope MUST include openid; M2M tokens
        (client_credentials, subject client:*) are rejected with 403. The response
        includes the email_verified claim (F-024) when an email is present.'
      operationId: get_oauth2_userinfo
      responses:
        '200':
          content:
            application/json:
              example:
                email: john@example.com
                email_verified: true
                name: john_doe
                roles:
                - user
                - admin
                sub: '1'
          description: User information retrieved successfully
        '400':
          description: Invalid User ID format
        '401':
          description: Invalid or expired access token
        '403':
          description: 'insufficient_scope -- the access token lacks the openid scope
            (RFC 6750 §3; accompanied by WWW-Authenticate: Bearer error="insufficient_scope")'
        '404':
          content:
            application/json:
              example:
                error: User not found
          description: User not found
      security:
      - bearerAuth: []
      summary: Get user information
      tags:
      - OAuth2
      - User
  /oauth2/webauthn/authenticate/begin:
    post:
      description: Start WebAuthn authentication.
      operationId: post_oauth2_webauthn_authenticate_begin
      responses:
        '200':
          description: WebAuthn authentication options
      summary: WebAuthn Authenticate Begin
      tags:
      - WebAuthn
  /oauth2/webauthn/authenticate/finish:
    post:
      description: Finish WebAuthn authentication.
      operationId: post_oauth2_webauthn_authenticate_finish
      responses:
        '200':
