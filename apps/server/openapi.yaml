components:
  schemas:
    Error:
      properties:
        category:
          type: string
        code:
          type: integer
        details:
          type: string
        message:
          type: string
        request_id:
          type: string
      type: object
    TokenResponse:
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
        refresh_token:
          type: string
        token_type:
          type: string
      type: object
  securitySchemes:
    bearerAuth:
      scheme: bearer
      type: http
    clientCredentialsAuth:
      description: 'OAuth2 client authentication (RFC 6749 §2.3): client_id and client_secret
        via HTTP Basic Authorization header or POST body parameters.'
      scheme: basic
      type: http
info:
  description: OAuth2.0 authorization server with token management
  title: OAuth2 Authorization Server API
  version: 1.0.0
openapi: 3.0.0
paths:
  /.well-known/jwks.json:
    get:
      description: Returns the public keys used by this server to sign JWTs.
      operationId: get_.well-known_jwks.json
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: JSON Web Key Set
      summary: JSON Web Key Set
      tags:
      - OpenID Connect
      - Security
  /.well-known/openid-configuration:
    get:
      description: Returns OIDC discovery metadata including endpoints and supported
        scopes.
      operationId: get_.well-known_openid-configuration
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: OIDC Provider Metadata
      summary: OpenID Connect Discovery
      tags:
      - OpenID Connect
  /api/admin/clients:
    get:
      description: Get a paginated list of registered OAuth2 clients.
      operationId: get_api_admin_clients
      responses:
        '200':
          description: List of OAuth2 clients
        '401':
          description: Unauthorized
        '403':
          description: 'insufficient_scope / insufficient permissions -- the access
            token lacks the `admin` scope OR the user lacks the admin role (RFC 6750
            §3; on a scope failure accompanied by WWW-Authenticate: Bearer
            error="insufficient_scope", scope="admin"). F-010: /api/admin/* requires
            the `admin` scope in addition to the RBAC admin role.'
      security:
      - bearerAuth: []
      summary: List OAuth2 Clients
      tags:
      - Admin
      - Clients
    post:
      description: Register a new OAuth2 client.
      operationId: post_api_admin_clients
      responses:
        '201':
          description: Client created successfully
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: Create OAuth2 Client
      tags:
      - Admin
      - Clients
  /api/admin/clients/{clientId}:
    delete:
      description: Delete a specific OAuth2 client.
      operationId: delete_api_admin_clients_{clientId}
      parameters:
      - description: Client ID
        in: path
        name: clientId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Client deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Client not found
      security:
      - bearerAuth: []
      summary: Delete OAuth2 Client
      tags:
      - Admin
      - Clients
    get:
      description: Get details of a specific OAuth2 client by ID.
      operationId: get_api_admin_clients_{clientId}
      parameters:
      - description: Client ID
        in: path
        name: clientId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Client details
        '401':
          description: Unauthorized
        '404':
          description: Client not found
      security:
      - bearerAuth: []
      summary: Get Client Details
      tags:
      - Admin
      - Clients
    put:
      description: Update details of a specific OAuth2 client.
      operationId: put_api_admin_clients_{clientId}
      parameters:
      - description: Client ID
        in: path
        name: clientId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Client updated successfully
        '400':
          description: Invalid request body
        '401':
          description: Unauthorized
        '404':
          description: Client not found
      security:
      - bearerAuth: []
      summary: Update OAuth2 Client
      tags:
      - Admin
      - Clients
  /api/admin/clients/{clientId}/reset-secret:
    post:
      description: Reset the secret of a specific OAuth2 client.
      operationId: post_api_admin_clients_{clientId}_reset-secret
      parameters:
      - description: Client ID
        in: path
        name: clientId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Client secret reset successfully
        '401':
          description: Unauthorized
        '404':
          description: Client not found
      security:
      - bearerAuth: []
      summary: Reset Client Secret
      tags:
      - Admin
      - Clients
  /api/admin/clients/{clientId}/scopes:
    get:
      description: Get the assigned scopes for an OAuth2 client.
      operationId: get_api_admin_clients_{clientId}_scopes
      parameters:
      - description: Client ID
        in: path
        name: clientId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Client scopes retrieved
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: Get Client Scopes
      tags:
      - Admin
      - Clients
    put:
      description: Update the assigned scopes for an OAuth2 client.
      operationId: put_api_admin_clients_{clientId}_scopes
      parameters:
      - description: Client ID
        in: path
        name: clientId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Client scopes updated successfully
        '400':
          description: Invalid request body
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: Update Client Scopes
      tags:
      - Admin
      - Clients
  /api/admin/logs:
    get:
      description: Get a paginated list of system audit logs.
      operationId: get_api_admin_logs
      responses:
        '200':
          description: Audit logs list
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: List Audit Logs
      tags:
      - Admin
      - Logs
  /api/admin/oidc/keys:
    get:
      description: Get information about OIDC signing keys.
      operationId: get_api_admin_oidc_keys
      responses:
        '200':
          description: OIDC signing key information
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: Get OIDC Keys Info
      tags:
      - Admin
      - OIDC
  /api/admin/tokens:
    get:
      description: Get a list of active OAuth2 tokens.
      operationId: get_api_admin_tokens
      responses:
        '200':
          description: Tokens list
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: List Tokens
      tags:
      - Admin
      - Tokens
  /api/admin/tokens/revoke-by-client:
    post:
      description: Revoke all tokens issued to a specific client.
      operationId: post_api_admin_tokens_revoke-by-client
      responses:
        '200':
          description: Tokens revoked successfully
        '400':
          description: Invalid request body
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: Revoke Tokens By Client
      tags:
      - Admin
      - Tokens
  /api/admin/tokens/revoke-by-user:
    post:
      description: Revoke all tokens issued for a specific user.
      operationId: post_api_admin_tokens_revoke-by-user
      responses:
        '200':
          description: Tokens revoked successfully
        '400':
          description: Invalid request body
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: Revoke Tokens By User
      tags:
      - Admin
      - Tokens
  /api/admin/tokens/{tokenPrefix}:
    delete:
      description: Revoke a specific token by its prefix.
      operationId: delete_api_admin_tokens_{tokenPrefix}
      parameters:
      - description: Token prefix
        in: path
        name: tokenPrefix
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Token revoked successfully
        '401':
          description: Unauthorized
        '404':
          description: Token not found
      security:
      - bearerAuth: []
      summary: Revoke Token
      tags:
      - Admin
      - Tokens
  /api/admin/users:
    get:
      description: >-
        List users with optional pagination (page, per_page) and filtering
        (q for username/email prefix, role, locked). Returns total count.
      operationId: get_api_admin_users
      parameters:
      - description: Page number (1-based)
        in: query
        name: page
        required: false
        schema:
          type: integer
          default: 1
      - description: Items per page (1-100)
        in: query
        name: per_page
        required: false
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 100
      - description: Search by username or email prefix
        in: query
        name: q
        required: false
        schema:
          type: string
      - description: Filter by role name
        in: query
        name: role
        required: false
        schema:
          type: string
      - description: Filter by lock state (true = locked, false = active)
        in: query
        name: locked
        required: false
        schema:
          type: string
          enum: ["true", "false"]
      responses:
        '200':
          description: Users list
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: List Users
      tags:
      - Admin
      - Users
    post:
      description: >-
        Create a new user. Requires username and password; email, roles,
        mfa_enabled, email_verified, and org_id are optional.
      operationId: post_api_admin_users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
                email:
                  type: string
                email_verified:
                  type: boolean
                mfa_enabled:
                  type: boolean
                org_id:
                  type: integer
                roles:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: User created successfully
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - bearerAuth: []
      summary: Create User
      tags:
      - Admin
      - Users
  /api/admin/users/{userId}/disable:
    put:
      description: Disable a specific user account.
      operationId: put_api_admin_users_{userId}_disable
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: User disabled successfully
        '401':
          description: Unauthorized
        '404':
          description: User not found
      security:
      - bearerAuth: []
      summary: Disable User
      tags:
      - Admin
      - Users
  /api/admin/users/{userId}/roles:
    get:
      description: Get the roles assigned to a specific user.
      operationId: get_api_admin_users_{userId}_roles
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  roles:
                    items:
                      properties:
                        description:
                          type: string
                        id:
                          type: integer
                        name:
                          type: string
                      type: object
                    type: array
                  status:
                    type: string
                type: object
          description: User roles retrieved
        '404':
          description: User not found
      security:
      - bearerAuth: []
      summary: Get User Roles
      tags:
      - Admin
      - Users
    put:
      description: Assign roles to a specific user.
      operationId: put_api_admin_users_{userId}_roles
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              properties:
                roles:
                  items:
                    type: string
                  type: array
              required:
              - roles
              type: object
      responses:
        '200':
          description: Roles assigned successfully
        '400':
          description: Invalid request body
      security:
      - bearerAuth: []
      summary: Assign User Roles
      tags:
      - Admin
      - Users
  /api/admin/users/{userId}:
    get:
      description: Get detailed information about a specific user including roles and
        account status.
      operationId: get_api_admin_users_{userId}
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  created_at:
                    type: string
                  email:
                    type: string
                  email_verified:
                    type: boolean
                  failed_login_count:
                    type: integer
                  id:
                    type: integer
                  locked:
                    type: boolean
                  locked_until:
                    type: integer
                  mfa_enabled:
                    type: boolean
                  roles:
                    items:
                      type: string
                    type: array
                  status:
                    type: string
                  username:
                    type: string
                type: object
          description: User details
        '404':
          description: User not found
      security:
      - bearerAuth: []
      summary: Get User Detail
      tags:
      - Admin
      - Users
    put:
      description: Update user information (email, email_verified).
      operationId: put_api_admin_users_{userId}
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              properties:
                email:
                  type: string
                email_verified:
                  type: boolean
              type: object
      responses:
        '200':
          description: User updated successfully
        '404':
          description: User not found
      security:
      - bearerAuth: []
      summary: Update User
      tags:
      - Admin
      - Users
    delete:
      description: >-
        Soft-delete a user account (sets deleted_at). The user is excluded
        from all queries and can no longer log in.
      operationId: delete_api_admin_users_{userId}
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: User deleted successfully
        '404':
          description: User not found
      security:
      - bearerAuth: []
      summary: Delete User
      tags:
      - Admin
      - Users
  /api/admin/users/{userId}/enable:
    post:
      description: Enable a disabled user account by resetting lockout state.
      operationId: post_api_admin_users_{userId}_enable
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: User enabled successfully
        '404':
          description: User not found
      security:
      - bearerAuth: []
      summary: Enable User
      tags:
      - Admin
      - Users
  /api/admin/roles:
    get:
      description: Get a list of all roles with user counts.
      operationId: get_api_admin_roles
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  roles:
                    items:
                      properties:
                        created_at:
                          type: string
                        description:
                          type: string
                        id:
                          type: integer
                        name:
                          type: string
                        user_count:
                          type: integer
                      type: object
                    type: array
                  status:
                    type: string
                  total:
                    type: integer
                type: object
          description: Roles list
      security:
      - bearerAuth: []
      summary: List Roles
      tags:
      - Admin
      - Roles
    post:
      description: Create a new role. Built-in roles (admin, user) cannot be duplicated.
      operationId: post_api_admin_roles
      requestBody:
        content:
          application/json:
            schema:
              properties:
                description:
                  type: string
                name:
                  type: string
              required:
              - name
              type: object
      responses:
        '201':
          description: Role created successfully
        '400':
          description: Invalid request
        '409':
          description: Role name already exists
      security:
      - bearerAuth: []
      summary: Create Role
      tags:
      - Admin
      - Roles
  /api/admin/roles/{roleId}:
    delete:
      description: Delete a role. Built-in roles (admin, user) cannot be deleted.
      operationId: delete_api_admin_roles_{roleId}
      parameters:
      - description: Role ID
        in: path
        name: roleId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Role deleted successfully
        '404':
          description: Role not found or is built-in
      security:
      - bearerAuth: []
      summary: Delete Role
      tags:
      - Admin
      - Roles
    put:
      description: Update a role's description.
      operationId: put_api_admin_roles_{roleId}
      parameters:
      - description: Role ID
        in: path
        name: roleId
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              properties:
                description:
                  type: string
              type: object
      responses:
        '200':
          description: Role updated successfully
        '404':
          description: Role not found
      security:
      - bearerAuth: []
      summary: Update Role
      tags:
      - Admin
      - Roles
  /api/admin/scopes:
    get:
      description: Get a list of all available scopes.
      operationId: get_api_admin_scopes
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  scopes:
                    items:
                      properties:
                        description:
                          type: string
                        id:
                          type: integer
                        is_default:
                          type: boolean
                        mapped_role:
                          type: string
                        name:
                          type: string
                        requires_admin_role:
                          type: boolean
                      type: object
                    type: array
                  status:
                    type: string
                  total:
                    type: integer
                type: object
          description: Scopes list
      security:
      - bearerAuth: []
      summary: List Scopes
      tags:
      - Admin
      - Scopes
    post:
      description: Create a new OAuth2 scope. Built-in scopes cannot be duplicated.
      operationId: post_api_admin_scopes
      requestBody:
        content:
          application/json:
            schema:
              properties:
                description:
                  type: string
                is_default:
                  type: boolean
                mapped_role:
                  type: string
                name:
                  type: string
                requires_admin_role:
                  type: boolean
              required:
              - name
              type: object
      responses:
        '201':
          description: Scope created successfully
        '400':
          description: Invalid request
        '409':
          description: Scope name already exists
      security:
      - bearerAuth: []
      summary: Create Scope
      tags:
      - Admin
      - Scopes
  /api/admin/scopes/{scopeId}:
    delete:
      description: Delete a scope. Built-in scopes (openid, profile, email, admin)
        cannot be deleted.
      operationId: delete_api_admin_scopes_{scopeId}
      parameters:
      - description: Scope ID
        in: path
        name: scopeId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Scope deleted successfully
        '404':
          description: Scope not found or is built-in
      security:
      - bearerAuth: []
      summary: Delete Scope
      tags:
      - Admin
      - Scopes
    put:
      description: Update a scope's properties.
      operationId: put_api_admin_scopes_{scopeId}
      parameters:
      - description: Scope ID
        in: path
        name: scopeId
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              properties:
                description:
                  type: string
                is_default:
                  type: boolean
                mapped_role:
                  type: string
                requires_admin_role:
                  type: boolean
              type: object
      responses:
        '200':
          description: Scope updated successfully
        '404':
          description: Scope not found
      security:
      - bearerAuth: []
      summary: Update Scope
      tags:
      - Admin
      - Scopes
  /api/admin/dashboard/stats:
    get:
      description: Get dashboard statistics including user count, client count, active
        tokens, and failure metrics.
      operationId: get_api_admin_dashboard_stats
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  active_tokens:
                    type: integer
                  failures_today:
                    type: integer
                  logs_today:
                    type: integer
                  status:
                    type: string
                  total_clients:
                    type: integer
                  total_users:
                    type: integer
                type: object
          description: Dashboard statistics
      security:
      - bearerAuth: []
      summary: Get Dashboard Stats
      tags:
      - Admin
      - Dashboard
  /api/github/login:
    post:
      description: Exchange GitHub authorization code for user information. This endpoint
        handles the server-side OAuth2 flow with GitHub.
      operationId: post_api_github_login
      parameters:
      - description: Authorization code from GitHub OAuth2 callback (required)
        in: query
        name: code
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  avatar_url:
                    type: string
                  email:
                    type: string
                  id:
                    type: integer
                  login:
                    type: string
                  name:
                    type: string
                type: object
          description: GitHub user info retrieved successfully
        '400':
          description: Invalid request (missing or invalid code)
        '502':
          description: Failed to contact GitHub API
      summary: GitHub OAuth2 Login
      tags:
      - External Auth
      - GitHub
  /api/google/login:
    post:
      description: Exchange Google authorization code for user information. This endpoint
        handles the server-side OAuth2 flow with Google Identity Platform.
      operationId: post_api_google_login
      parameters:
      - description: Authorization code from Google OAuth2 callback (required)
        in: query
        name: code
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                email: john.doe@gmail.com
                name: John Doe
                picture: https://lh3.googleusercontent.com/...
                sub: '123456789012345678901'
          description: Google user info retrieved successfully
        '400':
          content:
            application/json:
              example:
                error: Missing code parameter
          description: Invalid request (missing or invalid code)
        '502':
          description: Failed to contact Google API
      summary: Google OAuth2 Login
      tags:
      - External Auth
      - Google
  /api/me:
    delete:
      description: Soft-delete the current user's account.
      operationId: delete_api_me
      responses:
        '200':
          description: Account deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: User not found
      security:
      - bearerAuth: []
      summary: Delete Account
      tags:
      - User Profile
    get:
      description: Get current user's profile information.
      operationId: get_api_me
      responses:
        '200':
          description: User profile
        '401':
          description: Unauthorized
        '403':
          description: 'insufficient_scope -- the access token lacks the `profile`
            scope (RFC 6750 §3; accompanied by WWW-Authenticate: Bearer
            error="insufficient_scope", scope="profile"). F-010.'
        '404':
          description: User not found
      security:
      - bearerAuth: []
      summary: Get User Profile
      tags:
      - User Profile
  /api/me/authorized-apps:
    get:
      description: List OAuth2 clients authorized by the current user.
      operationId: get_api_me_authorized-apps
      responses:
        '200':
          description: Authorized apps list
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: List Authorized Apps
      tags:
      - User Profile
  /api/me/authorized-apps/{clientId}:
    delete:
      description: Revoke the current user's authorization for a specific OAuth2 client.
      operationId: delete_api_me_authorized-apps_{clientId}
      parameters:
      - description: Client ID
        in: path
        name: clientId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Authorization revoked successfully
        '401':
          description: Unauthorized
        '404':
          description: User not found
      security:
      - bearerAuth: []
      summary: Revoke App Authorization
      tags:
      - User Profile
  /api/me/password:
    put:
