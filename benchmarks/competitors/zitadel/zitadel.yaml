# Zitadel runtime config — benchmark stack (mounted by docker-compose.yml).
# Reference: https://zitadel.com/docs/self-hosting/configure
# Static shape only; instance bootstrap lives in setup-steps.yaml (rendered by
# setup.sh). The Database block MUST live here: in v2.x the --steps file only
# carries FirstInstance (a Database block there is silently ignored and the
# server falls back to the CockroachDB default).

ExternalPort: 8080
ExternalDomain: localhost
ExternalSecure: false

TLS:
  Enabled: false

# log quieter for benchmarks (default info)
Log:
  Level: warn

Database:
  postgres:
    Host: postgres
    Port: 5432
    Database: zitadel
    # D1 pool alignment (same deviation as Keycloak/Hydra, fairness-annotated
    # in COMPARISON.md): cap Zitadel's connection pool at 25 like the others.
    MaxOpenConns: 25
    User:
      Username: zitadel
      Password: zitadel
      SSL:
        Mode: disable
    Admin:
      Username: zitadel
      Password: zitadel
      SSL:
        Mode: disable
