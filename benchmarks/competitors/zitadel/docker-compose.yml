# Zitadel benchmark stack — competitor-benchmark-design.md M2 (§七).
#
# Config baseline = official self-hosting guidance, no tuning:
#   https://zitadel.com/docs/self-hosting/deploy/compose
#   https://zitadel.com/docs/self-hosting/configure
#
# Deviations from stock defaults — fairness-annotated in COMPARISON.md (D2/AC4):
#   * single-node compose (no networking/observability sidecars from the
#     official example) — same shape as the other three bench stacks;
#   * Postgres pool capped at 25 via MaxOpenConns in zitadel.yaml
#     (D1 alignment, same deviation family as Keycloak/Hydra).
#
# The masterkey is a REQUIRED env var (32 chars) — setup.sh generates a
# throwaway value; nothing committed. setup-steps.yaml (FirstInstance) is
# rendered by setup.sh with runtime-generated credentials and mounted
# read-only. FirstInstance.MachineKeyPath/PatPath write the machine key and
# PAT into the ./machinekey bind mount (gitignored; setup.sh copies them out,
# with a stdout-scrape fallback).

name: zitadel-bench

services:
  postgres:
    image: postgres:17-alpine        # same image tag as the AuthForge bench stack (D1, bumped 15->17 in step 2)
    container_name: zitadel-bench-postgres
    environment:
      POSTGRES_DB: zitadel
      POSTGRES_USER: zitadel
      POSTGRES_PASSWORD: zitadel
    volumes:
      - zitadel-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zitadel -d zitadel"]
      interval: 2s
      timeout: 2s
      retries: 60

  zitadel:
    # current stable line (2026-08), same generation as Keycloak 26.7 / Hydra 26.2;
    # v2.71 was two majors behind — benchmarking it would misrepresent Zitadel.
    # v4 also carries the eventstore/projection performance rework that
    # Zitadel's own published benchmarks measure.
    image: ghcr.io/zitadel/zitadel:v4.17.1
    container_name: zitadel-bench-zitadel
    # start-from-init = init (schemas/tables) -> setup (migrations + FirstInstance)
    # -> serve, in ONE process. start-from-setup assumes an already-initialized
    # DB ("Requirements: database is initialized") and fails on a fresh volume
    # with "relation eventstore.events does not exist".
    command: ["start-from-init", "--masterkeyFromEnv", "--config", "/zitadel.yaml", "--steps", "/setup-steps.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:?set by setup.sh}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./zitadel.yaml:/zitadel.yaml:ro
      # the RENDERED steps file (placeholders substituted by setup.sh before
      # `up`; the template itself is never mounted)
      - ./setup-steps.rendered.yaml:/setup-steps.yaml:ro
      # FirstInstance.MachineKeyPath/PatPath write here (bind mount so the
      # non-root container user can create files)
      - ./machinekey:/machinekey

volumes:
  zitadel-pgdata:
    name: zitadel-bench-pgdata
