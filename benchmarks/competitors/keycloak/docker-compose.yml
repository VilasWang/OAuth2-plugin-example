# Keycloak benchmark stack — competitor-benchmark-design.md M1 (§七).
#
# Config baseline = official recommended production container setup, no tuning:
#   https://www.keycloak.org/server/containers
#   https://www.keycloak.org/server/db (PostgreSQL via runtime env, KC 26)
#
# Deviations from stock defaults — every one fairness-annotated in
# benchmarks/competitors/results/COMPARISON.md (design D2 / AC4):
#   * KC_DB_POOL_MAX_SIZE=25 — align the PG connection pool with AuthForge's
#     benchmark config (design D1 "same backend, pool aligned"; KC default 100).
#   * KC_HEALTH_ENABLED=true — exposes /health/ready as the cold-start probe
#     (official production observability recommendation).
#   * Realm access-token lifespan 3600s (set by setup.sh, not here) — token
#     pools must survive the ~15min staircase session; default 300s expires
#     pools mid-run. Signature/verification path is identical, non-perf.
#   * mem_limit 2g — official container memory guidance.
#
# Bootstrap credentials are REQUIRED env vars (no defaults, nothing committed):
# setup.sh generates random throwaway values for this local-only bench stack.

name: kc-bench

services:
  postgres:
    image: postgres:15-alpine        # same image tag as the AuthForge bench stack (D1)
    container_name: kc-bench-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - kc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 2s
      timeout: 2s
      retries: 60

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1   # pinned 2026-08-15 (latest stable)
    container_name: kc-bench-keycloak
    command: ["start"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?set by setup.sh}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set by setup.sh}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_DB_POOL_MAX_SIZE: "25"       # D1 alignment (see header note)
      KC_HEALTH_ENABLED: "true"       # /health/ready probe
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 2g                     # official container memory guidance
    volumes:
      - kc-data:/opt/keycloak/data

volumes:
  kc-pgdata:
    name: kc-bench-pgdata
  kc-data:
    name: kc-bench-data
