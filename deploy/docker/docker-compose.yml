# DEV-ONLY compose: hardcoded weak credentials (DB "123456", Redis
# "redis_secret_pass", vue-client secret "123456", seeded admin/admin).
# Production MUST use docker-compose.prod.yml (.env.docker driven) -- the
# server's production validator (FULLA_ENV=production) rejects these defaults.
# Data-service ports are loopback-bound on purpose; widen them only on a
# trusted network.
services:
  fulla-admin:
    build:
      context: ../../frontends/admin
      dockerfile: Dockerfile
    container_name: fulla-admin
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - fulla-backend
    networks:
      - oauth2-net

  fulla-frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: frontend-runtime
    container_name: fulla-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - fulla-backend
    networks:
      - oauth2-net

  fulla-backend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: backend-runtime
      args:
        # Alternate build-arm passthrough (empty = default preset). Set via
        # env before `docker compose build`, e.g. the LTO bench arm:
        #   FULLA_CMAKE_PRESET=linux-release-lto docker compose ... build
        - FULLA_CMAKE_PRESET=${FULLA_CMAKE_PRESET:-}
    container_name: fulla-backend
    restart: always
    ports:
      - "5555:5555"
    depends_on:
      fulla-postgres:
        condition: service_healthy
      fulla-redis:
        condition: service_started
    environment:
      - FULLA_DB_HOST=fulla-postgres
      - FULLA_DB_NAME=fulla_db
      - FULLA_DB_PASSWORD=123456
      - FULLA_REDIS_HOST=fulla-redis
      - FULLA_REDIS_PASSWORD=redis_secret_pass
      - FULLA_VUE_CLIENT_SECRET=123456
      - FULLA_AUTO_MIGRATE=true
      - FULLA_FRONTEND_URL=http://localhost:8080
      # Email / SMTP (omit via empty .env.docker values to stay in Console mode)
      - FULLA_SMTP_HOST=${FULLA_SMTP_HOST:-}
      - FULLA_SMTP_PORT=${FULLA_SMTP_PORT:-465}
      - FULLA_SMTP_USER=${FULLA_SMTP_USER:-}
      - FULLA_SMTP_PASSWORD=${FULLA_SMTP_PASSWORD:-}
      - FULLA_SMTP_FROM_NAME=${FULLA_SMTP_FROM_NAME:-OAuth2 Platform}
      - FULLA_SMTP_SSL=${FULLA_SMTP_SSL:-true}
    volumes:
      - ../../apps/server/config/config.json:/app/config.json:ro
      - ../../apps/server/migrations:/app/sql/migrations:ro
      - ../../apps/server/seed:/app/sql/seed:ro
    networks:
      - oauth2-net

  fulla-postgres:
    # PG 17 since 2026-08-18 (aligns server with the libpq 17.x client; bench
    # measured on 17). UPGRADE CAVEAT for existing deployments: a 15-era data
    # volume will NOT start on 17 — dump/restore or pg_upgrade first
    # (docs/ops/deployment.md §性能调优 / 升级注记).
    image: postgres:17-alpine
    container_name: fulla-postgres
    restart: always
    environment:
      - POSTGRES_USER=fulla_user
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=fulla_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mounted as SUBDIRECTORIES of initdb.d: the postgres entrypoint does
      # not recurse into subdirectories, so this stays a no-op (same as the
      # pre-restructure mount of the old sql/ wrapper dir).
      - ../../apps/server/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ../../apps/server/seed:/docker-entrypoint-initdb.d/seed:ro
    networks:
      - oauth2-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulla_user -d fulla_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  fulla-redis:
    image: redis:7-alpine
    container_name: fulla-redis
    restart: always
    command: redis-server --requirepass redis_secret_pass
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    networks:
      - oauth2-net

  fulla-prometheus:
    image: prom/prometheus:latest
    container_name: fulla-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - promdata:/prometheus
    networks:
      - oauth2-net

networks:
  oauth2-net:
    driver: bridge

volumes:
  pgdata:
    name: oauth2-plugin_postgres_prod
  redisdata:
    name: oauth2-plugin_redis_prod
  promdata:
    name: oauth2-plugin_prometheus_prod
