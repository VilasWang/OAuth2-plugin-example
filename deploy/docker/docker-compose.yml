
services:
  oauth2-admin:
    build:
      context: ../../frontends/admin
      dockerfile: Dockerfile
    container_name: oauth2-admin
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - oauth2-backend
    networks:
      - oauth2-net

  oauth2-frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: frontend-runtime
    container_name: oauth2-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - oauth2-backend
    networks:
      - oauth2-net

  oauth2-backend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: backend-runtime
    container_name: oauth2-backend
    restart: always
    ports:
      - "5555:5555"
    depends_on:
      oauth2-postgres:
        condition: service_healthy
      oauth2-redis:
        condition: service_started
    environment:
      - OAUTH2_DB_HOST=oauth2-postgres
      - OAUTH2_DB_NAME=oauth2_db
      - OAUTH2_DB_PASSWORD=123456
      - OAUTH2_REDIS_HOST=oauth2-redis
      - OAUTH2_REDIS_PASSWORD=redis_secret_pass
      - OAUTH2_VUE_CLIENT_SECRET=123456
      - OAUTH2_AUTO_MIGRATE=true
      - OAUTH2_FRONTEND_URL=http://localhost:8080
      # Email / SMTP (omit via empty .env.docker values to stay in Console mode)
      - OAUTH2_SMTP_HOST=${OAUTH2_SMTP_HOST:-}
      - OAUTH2_SMTP_PORT=${OAUTH2_SMTP_PORT:-465}
      - OAUTH2_SMTP_USER=${OAUTH2_SMTP_USER:-}
      - OAUTH2_SMTP_PASSWORD=${OAUTH2_SMTP_PASSWORD:-}
      - OAUTH2_SMTP_FROM_NAME=${OAUTH2_SMTP_FROM_NAME:-OAuth2 Platform}
      - OAUTH2_SMTP_SSL=${OAUTH2_SMTP_SSL:-true}
    volumes:
      - ../../apps/server/config/config.json:/app/config.json:ro
      - ../../apps/server/migrations:/app/sql/migrations:ro
      - ../../apps/server/seed:/app/sql/seed:ro
    networks:
      - oauth2-net

  oauth2-postgres:
    # PG 17 since 2026-08-18 (aligns server with the libpq 17.x client; bench
    # measured on 17). UPGRADE CAVEAT for existing deployments: a 15-era data
    # volume will NOT start on 17 — dump/restore or pg_upgrade first
    # (docs/ops/deployment.md §性能调优 / 升级注记).
    image: postgres:17-alpine
    container_name: oauth2-postgres
    restart: always
    environment:
      - POSTGRES_USER=oauth2_user
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=oauth2_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mounted as SUBDIRECTORIES of initdb.d: the postgres entrypoint does
      # not recurse into subdirectories, so this stays a no-op (same as the
      # pre-restructure mount of the old sql/ wrapper dir).
      - ../../apps/server/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ../../apps/server/seed:/docker-entrypoint-initdb.d/seed:ro
    networks:
      - oauth2-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oauth2_user -d oauth2_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  oauth2-redis:
    image: redis:7-alpine
    container_name: oauth2-redis
    restart: always
    command: redis-server --requirepass redis_secret_pass
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    networks:
      - oauth2-net

  oauth2-prometheus:
    image: prom/prometheus:latest
    container_name: oauth2-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - promdata:/prometheus
    networks:
      - oauth2-net

networks:
  oauth2-net:
    driver: bridge

volumes:
  pgdata:
    name: oauth2-plugin_postgres_prod
  redisdata:
    name: oauth2-plugin_redis_prod
  promdata:
    name: oauth2-plugin_prometheus_prod
