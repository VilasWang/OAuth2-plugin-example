# Production Docker Compose
# Usage: cp .env.docker.example .env.docker && docker-compose -f docker-compose.prod.yml --env-file .env.docker up -d
#
# Task 37: services reference the versioned ghcr images published by
# release.yml (set AUTHFORGE_VERSION to pin; `--build` still works and tags
# the local build with the same name). Schema migrations run through the
# one-shot `migrate` service (profile "migrate"), not at app startup:
#   docker compose -f docker-compose.prod.yml --env-file .env.docker \
#     --profile migrate run --rm migrate
# The app itself keeps OAUTH2_AUTO_MIGRATE=false and only self-checks.

services:
  nginx:
    image: nginx:stable-alpine
    container_name: oauth2-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../deploy/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      oauth2-backend:
        condition: service_healthy
      oauth2-frontend:
        condition: service_started
      oauth2-admin:
        condition: service_started
    networks:
      - oauth2-net

  oauth2-frontend:
    image: ghcr.io/lucaswang420/authforge-frontend:${AUTHFORGE_VERSION:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: frontend-runtime
      args:
        # Vite build-time vars (inlined into the SPA bundle)
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_CLIENT_ID: ${VITE_CLIENT_ID:-vue-client}
        VITE_REDIRECT_URI: ${VITE_REDIRECT_URI:-}
        VITE_GITHUB_CLIENT_ID: ${VITE_GITHUB_CLIENT_ID:-}
    container_name: oauth2-frontend
    restart: always
    expose:
      - "80"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    networks:
      - oauth2-net

  oauth2-admin:
    image: ghcr.io/lucaswang420/authforge-admin:${AUTHFORGE_VERSION:-latest}
    build:
      context: ../../frontends/admin
      dockerfile: Dockerfile
    container_name: oauth2-admin
    restart: always
    expose:
      - "80"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    networks:
      - oauth2-net

  oauth2-backend:
    image: ghcr.io/lucaswang420/authforge-backend:${AUTHFORGE_VERSION:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: backend-runtime
    container_name: oauth2-backend
    restart: always
    expose:
      - "5555"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
    depends_on:
      oauth2-postgres:
        condition: service_healthy
      oauth2-redis:
        condition: service_started
    environment:
      - OAUTH2_ENV=${OAUTH2_ENV:-production}
      - OAUTH2_ISSUER=${OAUTH2_ISSUER}
      - OAUTH2_JWT_KEY_PATH=${OAUTH2_JWT_KEY_PATH:-/app/keys/signing.pem}
      - OAUTH2_DB_HOST=${OAUTH2_DB_HOST}
      - OAUTH2_DB_PORT=${OAUTH2_DB_PORT:-5432}
      - OAUTH2_DB_NAME=${OAUTH2_DB_NAME}
      - OAUTH2_DB_USER=${OAUTH2_DB_USER}
      - OAUTH2_DB_PASSWORD=${OAUTH2_DB_PASSWORD}
      - OAUTH2_REDIS_HOST=${OAUTH2_REDIS_HOST}
      - OAUTH2_REDIS_PORT=${OAUTH2_REDIS_PORT:-6379}
      - OAUTH2_REDIS_PASSWORD=${OAUTH2_REDIS_PASSWORD}
      - OAUTH2_LISTEN_PORT=${OAUTH2_LISTEN_PORT:-5555}
      - OAUTH2_FRONTEND_URL=${OAUTH2_FRONTEND_URL}
      - OAUTH2_CORS_ALLOW_ORIGINS=${OAUTH2_CORS_ALLOW_ORIGINS}
      - OAUTH2_VUE_REDIRECT_URI=${OAUTH2_VUE_REDIRECT_URI}
      - OAUTH2_VUE_CLIENT_SECRET=${OAUTH2_VUE_CLIENT_SECRET}
      - OAUTH2_GOOGLE_REDIRECT_URI=${OAUTH2_GOOGLE_REDIRECT_URI:-}
      # Migrations run via the `migrate` one-shot service (see header);
      # the app only self-checks the schema at startup.
      - OAUTH2_AUTO_MIGRATE=${OAUTH2_AUTO_MIGRATE:-false}
      - DETAILED_VALIDATION_ERRORS=${DETAILED_VALIDATION_ERRORS:-false}
      # External auth (optional)
      - OAUTH2_GITHUB_CLIENT_ID=${OAUTH2_GITHUB_CLIENT_ID:-}
      - OAUTH2_GITHUB_CLIENT_SECRET=${OAUTH2_GITHUB_CLIENT_SECRET:-}
      - OAUTH2_GOOGLE_CLIENT_ID=${OAUTH2_GOOGLE_CLIENT_ID:-}
      - OAUTH2_GOOGLE_CLIENT_SECRET=${OAUTH2_GOOGLE_CLIENT_SECRET:-}
      # Email / SMTP (生产环境必须配置，否则验证邮件/密码重置只输出到日志)
      - OAUTH2_SMTP_HOST=${OAUTH2_SMTP_HOST:-}
      - OAUTH2_SMTP_PORT=${OAUTH2_SMTP_PORT:-465}
      - OAUTH2_SMTP_USER=${OAUTH2_SMTP_USER:-}
      - OAUTH2_SMTP_PASSWORD=${OAUTH2_SMTP_PASSWORD:-}
      - OAUTH2_SMTP_FROM_NAME=${OAUTH2_SMTP_FROM_NAME:-OAuth2 Platform}
      - OAUTH2_SMTP_SSL=${OAUTH2_SMTP_SSL:-true}
    volumes:
      - ../../deploy/keys:/app/keys:ro
      # migrations/seed are baked into the image (/app/sql/*) -- no volume
      # mounts, so the running container matches the released artifact.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - oauth2-net

  # One-shot schema migration executor (Task 37). Not started by default:
  #   docker compose -f docker-compose.prod.yml --env-file .env.docker \
  #     --profile migrate run --rm migrate
  # Exit code 0 = schema up to date, 1 = failure (compose surfaces it).
  migrate:
    image: ghcr.io/lucaswang420/authforge-backend:${AUTHFORGE_VERSION:-latest}
    profiles: ["migrate"]
    command: ["./authforge-server", "--migrate-only"]
    restart: "no"
    depends_on:
      oauth2-postgres:
        condition: service_healthy
    environment:
      - OAUTH2_ENV=${OAUTH2_ENV:-production}
      - OAUTH2_ISSUER=${OAUTH2_ISSUER}
      - OAUTH2_JWT_KEY_PATH=${OAUTH2_JWT_KEY_PATH:-/app/keys/signing.pem}
      - OAUTH2_DB_HOST=${OAUTH2_DB_HOST}
      - OAUTH2_DB_PORT=${OAUTH2_DB_PORT:-5432}
      - OAUTH2_DB_NAME=${OAUTH2_DB_NAME}
      - OAUTH2_DB_USER=${OAUTH2_DB_USER}
      - OAUTH2_DB_PASSWORD=${OAUTH2_DB_PASSWORD}
      - OAUTH2_REDIS_HOST=${OAUTH2_REDIS_HOST}
      - OAUTH2_REDIS_PORT=${OAUTH2_REDIS_PORT:-6379}
      - OAUTH2_REDIS_PASSWORD=${OAUTH2_REDIS_PASSWORD}
      - OAUTH2_VUE_CLIENT_SECRET=${OAUTH2_VUE_CLIENT_SECRET}
    volumes:
      - ../../deploy/keys:/app/keys:ro
    networks:
      - oauth2-net

  oauth2-postgres:
    image: postgres:15-alpine
    container_name: oauth2-postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - oauth2-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  oauth2-redis:
    image: redis:7-alpine
    container_name: oauth2-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    networks:
      - oauth2-net

  oauth2-prometheus:
    image: prom/prometheus:latest
    container_name: oauth2-prometheus
    restart: always
    ports:
      # Loopback only: reach it via SSH tunnel / reverse proxy, never the
      # public interface.
      - "127.0.0.1:9090:9090"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    networks:
      - oauth2-net

networks:
  oauth2-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  promdata:
