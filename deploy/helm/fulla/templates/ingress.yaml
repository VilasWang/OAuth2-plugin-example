{{- if .Values.ingress.enabled }}
{{/*
Path layout mirrors deploy/nginx/nginx.conf: API prefixes to the backend,
/admin to the console, everything else to the SPA frontend.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "fulla.fullname" . }}
  labels:
    {{- include "fulla.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- range $path := list "/api" "/oauth2" "/.well-known" "/health" "/metrics" }}
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "fulla.fullname" $ }}-backend
                port:
                  name: http
          {{- end }}
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: {{ include "fulla.fullname" . }}-admin
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "fulla.fullname" . }}-frontend
                port:
                  name: http
{{- end }}
