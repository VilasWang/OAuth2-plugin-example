name: macOS CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  BUILD_TYPE: Release
  # All builds go through Conan + `cmake --preset` (parity with build.sh /
  # build.bat). The macos-arm64 preset installs into build/macos-arm64
  # (see CMakePresets.json binaryDir) and carries the Unix Makefiles
  # generator + CMAKE_OSX_ARCHITECTURES=arm64.
  CMAKE_PRESET: macos-arm64
  PRESET_DIR: build/macos-arm64

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        # Library dependencies (jsoncpp/openssl/libpq/hiredis/curl/zlib) are
        # now resolved by Conan via conanfile.py (design.md §9.1) instead of
        # Homebrew. git/cmake ship preinstalled on the GitHub-hosted macos-14
        # image at versions new enough for Conan (>=3.21); ossp-uuid is not
        # needed since Drogon's Conan recipe uses macOS's native uuid support.
        run: |
          # Refresh Homebrew formula index only (do NOT `brew upgrade` —
          # that can break the job whenever a preinstalled formula lacks an
          # arm64 bottle). No package installs required anymore.
          brew update

      - name: Install Conan
        # macos-14 runner ships a PEP 668 "externally-managed-environment"
        # Python, which blocks a plain `pip3 install`. --break-system-packages
        # is safe here: this is an ephemeral CI VM, not a shared system.
        run: |
          pip3 install --break-system-packages conan
          conan profile detect --force

      # --- Conan dependency cache ---
      # Keyed on conanfile.py + conan.lock content hash so the cache is
      # invalidated exactly when the dependency graph could have changed.
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-v1-cpp17-${{ hashFiles('conanfile.py', 'conan.lock') }}
          restore-keys: |
            conan-${{ runner.os }}-v1-cpp17-

      - name: Configure CMake using Conan
        # Drogon (with_orm/with_postgres/with_redis/with_ctl/with_sqlite/with_brotli)
        # and all other C++ dependencies are declared in conanfile.py and
        # resolved here instead of being cloned/compiled from source via brew.
        run: |
          conan install . --output-folder=${{env.PRESET_DIR}} --build=missing -s build_type=${{env.BUILD_TYPE}} -s compiler.cppstd=17 -s arch=armv8

      - name: Add drogon_ctl (Conan package) to PATH
        # drogon_create_views()/drogon_create_model() invoke `drogon_ctl` as a
        # bare command at BUILD time (see apps/server/CMakeLists.txt and
        # tests/CMakeLists.txt), so it must be resolvable on PATH.
        # Previously this worked because Drogon was `sudo cmake --install`ed
        # to /usr/local. Now that Drogon comes from Conan, its package's
        # bin/ dir (containing drogon_ctl) is not on PATH by default --
        # CMakeDeps' Drogon-*-data.cmake records the resolved package
        # folder, so we read it from there instead of hardcoding a Conan
        # cache layout.
        run: |
          data_file=$(find ${{env.PRESET_DIR}} -maxdepth 1 -name 'Drogon-*-data.cmake' | head -n1)
          if [ -z "$data_file" ]; then
            echo "::error::Could not find Drogon-*-data.cmake under ${{env.PRESET_DIR}}/ (conan install may have failed)"
            exit 1
          fi
          drogon_folder=$(grep -E 'set\(drogon_PACKAGE_FOLDER_RELEASE "' "$data_file" | sed -E 's/.*"(.+)".*/\1/')
          if [ -z "$drogon_folder" ]; then
            echo "::error::Could not parse drogon_PACKAGE_FOLDER_RELEASE from $data_file"
            exit 1
          fi
          drogon_bin="$drogon_folder/bin"
          if [ ! -x "$drogon_bin/drogon_ctl" ]; then
            echo "::error::drogon_ctl not found under $drogon_bin"
            exit 1
          fi
          echo "Adding $drogon_bin to PATH"
          echo "$drogon_bin" >> "$GITHUB_PATH"

      - name: Configure Project CMake
        run: |
          # Use CI config which uses memory storage instead of Postgres/Redis
          cp apps/server/config/config.ci.json apps/server/config/config.json

          # The preset carries the Unix Makefiles generator, CMAKE_BUILD_TYPE,
          # CMAKE_OSX_ARCHITECTURES=arm64, and the Conan toolchain file
          # (build/<preset>/conan_toolchain.cmake). OAUTH2_MEMORY_TESTS_ONLY is
          # CI-specific, so it is layered on with -D.
          cmake --preset ${{env.CMAKE_PRESET}} -DOAUTH2_MEMORY_TESTS_ONLY=ON
      - name: Build
        run: cmake --build --preset ${{env.CMAKE_PRESET}}

      - name: Run Tests
        working-directory: ${{github.workspace}}/${{env.PRESET_DIR}}
        run: ctest -V -C ${{env.BUILD_TYPE}} --output-on-failure --timeout 120
